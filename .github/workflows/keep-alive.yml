name: Keep Backend Alive

on:
  schedule:
    # Ping every 10 minutes — Render free tier sleeps after 15 min of inactivity
    - cron: '*/10 * * * *'
  workflow_dispatch: # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://motif-backend-ktr5.onrender.com/api/ping)
          echo "Response status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Server is warm"
          else
            echo "Server returned $STATUS (may still be waking up)"
          fi
